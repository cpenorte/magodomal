<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animação Feiticeiro Sombrio SVG/CSS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b2234 0%, #0d111a 100%);
      overflow: hidden;
    }

    .scene {
      width: 400px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Animação de flutuação suave do feiticeiro */
    .wizard-body {
      animation: floatWizard 4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes floatWizard {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    /* Animação de levitação do cajado e da esfera mágica */
    .staff-group {
      animation: floatStaff 4s ease-in-out infinite;
      animation-delay: -0.5s;
    }

    @keyframes floatStaff {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-14px) rotate(1.5deg);
      }
    }

    /* Brilho pulsante da esfera do cajado */
    .orb-glow {
      animation: pulseOrb 2.5s ease-in-out infinite;
      transform-origin: 295px 155px;
    }

    @keyframes pulseOrb {
      0%, 100% {
        transform: scale(1);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    /* Animação das estrelinhas da roupa e do chapéu */
    .star-twinkle-1 {
      animation: twinkle 3s ease-in-out infinite;
    }
    .star-twinkle-2 {
      animation: twinkle 3s ease-in-out infinite 1s;
    }
    .star-twinkle-3 {
      animation: twinkle 3s ease-in-out infinite 2s;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.65;
        filter: drop-shadow(0 0 1px #7f1d1d);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 5px #991b1b);
      }
    }

    /* Partículas mágicas flutuantes */
    .particle-1 {
      animation: riseParticle 3.5s ease-in infinite;
    }
    .particle-2 {
      animation: riseParticle 4.2s ease-in infinite 1.2s;
    }
    .particle-3 {
      animation: riseParticle 3s ease-in infinite 2.1s;
    }

    @keyframes riseParticle {
      0% {
        transform: translateY(0px) scale(0.5);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translateY(-45px) scale(1.1);
        opacity: 0;
      }
    }

    /* Sombra no chão acompanhando a flutuação */
    .floor-shadow {
      animation: shadowScale 4s ease-in-out infinite;
      transform-origin: 200px 415px;
    }

    @keyframes shadowScale {
      0%, 100% {
        transform: scaleX(1);
        opacity: 0.5;
      }
      50% {
        transform: scaleX(0.85);
        opacity: 0.3;
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <svg viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gradientes em tons de vermelho (vinho, carmesim e escarlate) -->
        <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#58111a" />
          <stop offset="50%" stop-color="#b91c1c" />
          <stop offset="100%" stop-color="#450a0a" />
        </linearGradient>

        <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#dc2626" />
          <stop offset="60%" stop-color="#991b1b" />
          <stop offset="100%" stop-color="#450a0a" />
        </linearGradient>

        <radialGradient id="orbGrad" cx="40%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#fecaca" />
          <stop offset="35%" stop-color="#ef4444" />
          <stop offset="80%" stop-color="#991b1b" />
          <stop offset="100%" stop-color="#450a0a" />
        </radialGradient>

        <!-- Definição do símbolo de estrelinha em vermelho escuro -->
        <polygon id="tiny-star" points="0,-6 1.8,-1.8 6,0 1.8,1.8 0,6 -1.8,1.8 -6,0 -1.8,-1.8" fill="#7f1d1d" />
      </defs>

      <!-- Sombra no chão -->
      <ellipse class="floor-shadow" cx="200" cy="415" rx="75" ry="12" fill="#05070c" />

      <!-- Grupo Principal do Feiticeiro -->
      <g class="wizard-body">
        
        <!-- Capa Traseira -->
        <path d="M135 200 L105 385 L295 385 L265 200 Z" fill="#3b070c" />

        <!-- Túnica Vermelha Principal -->
        <path d="M145 195 L115 390 L285 390 L255 195 Z" fill="url(#robeGrad)" />

        <!-- Detalhes e dobras da túnica -->
        <path d="M175 215 L165 390" stroke="#450a0a" stroke-width="3" stroke-linecap="round" />
        <path d="M225 215 L235 390" stroke="#450a0a" stroke-width="3" stroke-linecap="round" />
        <!-- Gola / V-neck dourado -->
        <path d="M165 195 L200 245 L235 195" fill="none" stroke="#eab308" stroke-width="4" stroke-linejoin="round" />

        <!-- Cinto da túnica -->
        <rect x="136" y="275" width="128" height="14" rx="4" fill="#0f172a" />
        <rect x="190" y="272" width="20" height="20" rx="3" fill="none" stroke="#facc15" stroke-width="3" />

        <!-- Estrelinhas Vermelho Escuro na Túnica -->
        <use href="#tiny-star" x="155" y="245" class="star-twinkle-1" transform="scale(0.9)" />
        <use href="#tiny-star" x="242" y="240" class="star-twinkle-2" transform="scale(0.85)" />
        <use href="#tiny-star" x="148" y="320" class="star-twinkle-3" transform="scale(1.1)" />
        <use href="#tiny-star" x="182" y="345" class="star-twinkle-1" transform="scale(0.8)" />
        <use href="#tiny-star" x="218" y="315" class="star-twinkle-2" transform="scale(1)" />
        <use href="#tiny-star" x="252" y="355" class="star-twinkle-3" transform="scale(0.9)" />
        <use href="#tiny-star" x="160" y="372" class="star-twinkle-2" transform="scale(0.75)" />
        <use href="#tiny-star" x="235" y="375" class="star-twinkle-1" transform="scale(0.85)" />

        <!-- Braço Esquerdo (segurando próximo ao peito) -->
        <path d="M148 202 Q115 240 140 275 L162 265 Q148 240 165 215 Z" fill="#991b1b" />
        <circle cx="152" cy="272" r="10" fill="#e2b49a" />

        <!-- Braço Direito (estendido para o cajado) -->
        <path d="M252 202 Q285 225 292 250 L272 258 Q265 235 242 215 Z" fill="#991b1b" />
        <circle cx="285" cy="252" r="10" fill="#e2b49a" />

        <!-- Cabelo Longo Traseiro (tons negros predominantes) -->
        <path d="M155 145 Q142 195 152 230 L248 230 Q258 195 245 145 Z" fill="#111827" />

        <!-- Rosto / Cabeça -->
        <rect x="168" y="128" width="64" height="68" rx="28" fill="#e2b49a" />

        <!-- Orelhas -->
        <circle cx="166" cy="162" r="7" fill="#d4a083" />
        <circle cx="234" cy="162" r="7" fill="#d4a083" />

        <!-- EXPRESSÃO SÉRIA -->
        <g>
          <!-- Olho esquerdo -->
          <ellipse cx="185" cy="158" rx="6" ry="4" fill="#ffffff" />
          <circle cx="186" cy="158" r="2.8" fill="#dc2626" />
          <path d="M178 155 L192 156" stroke="#c68e70" stroke-width="3" stroke-linecap="round" />

          <!-- Olho direito -->
          <ellipse cx="215" cy="158" rx="6" ry="4" fill="#ffffff" />
          <circle cx="214" cy="158" r="2.8" fill="#dc2626" />
          <path d="M208 156 L222 155" stroke="#c68e70" stroke-width="3" stroke-linecap="round" />
        </g>

        <!-- Sobrancelhas franzidas e grossas -->
        <path d="M174 148 L194 153" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" />
        <path d="M226 148 L206 153" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" />
        <!-- Ruga de expressão entre as sobrancelhas -->
        <path d="M198 148 L198 154 M202 148 L202 154" stroke="#b87d60" stroke-width="1.5" stroke-linecap="round" />

        <!-- Nariz definido -->
        <path d="M200 156 L197 170 L203 171" fill="none" stroke="#b87d60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Bigode e Barba Longa (tons negros predominantes) -->
        <!-- Barba -->
        <path d="M168 172 Q165 225 200 265 Q235 225 232 172 Q215 185 200 185 Q185 185 168 172 Z" fill="#090d16" />
        <path d="M185 195 Q190 230 200 255 M215 195 Q210 230 200 255" fill="none" stroke="#1f2937" stroke-width="2" />

        <!-- Bigode caído -->
        <path d="M178 182 Q190 174 200 177 Q210 174 222 182 Q212 186 200 181 Q188 186 178 182 Z" fill="#111827" />

        <!-- Boca fechada e firme -->
        <path d="M192 185 Q200 183 208 185" fill="none" stroke="#7c4d3b" stroke-width="2.5" stroke-linecap="round" />

        <!-- CHAPÉU DE FEITICEIRO VERMELHO -->
        <g>
          <!-- Aba do chapéu -->
          <ellipse cx="200" cy="134" rx="78" ry="16" fill="#450a0a" />
          <ellipse cx="200" cy="132" rx="76" ry="14" fill="#991b1b" />

          <!-- Cone pontudo dobrado na ponta -->
          <path d="M148 132 L188 45 Q196 32 215 48 L242 72 L222 72 L252 132 Z" fill="url(#hatGrad)" />

          <!-- Faixa dourada do chapéu -->
          <path d="M151 124 Q200 134 249 124 L251 131 Q200 141 149 131 Z" fill="#eab308" />

          <!-- Estrelinhas Vermelho Escuro no Chapéu -->
          <use href="#tiny-star" x="195" y="65" class="star-twinkle-2" transform="scale(0.85)" />
          <use href="#tiny-star" x="178" y="95" class="star-twinkle-1" transform="scale(1)" />
          <use href="#tiny-star" x="215" y="102" class="star-twinkle-3" transform="scale(0.9)" />
          <use href="#tiny-star" x="196" y="114" class="star-twinkle-1" transform="scale(0.75)" />
        </g>

      </g>

      <!-- Cajado Mágico (com animação independente sutil) -->
      <g class="staff-group">
        <!-- Haste de madeira -->
        <line x1="295" y1="175" x2="282" y2="395" stroke="#451a03" stroke-width="7" stroke-linecap="round" />
        <line x1="294" y1="175" x2="281" y2="395" stroke="#78350f" stroke-width="3" stroke-linecap="round" />

        <!-- Suporte dourado da esfera -->
        <path d="M285 172 Q295 182 305 172" fill="none" stroke="#eab308" stroke-width="4" stroke-linecap="round" />

        <!-- Aura brilhante da esfera -->
        <circle class="orb-glow" cx="295" cy="155" r="22" fill="#ef4444" opacity="0.4" />
        
        <!-- Esfera mágica -->
        <circle cx="295" cy="155" r="14" fill="url(#orbGrad)" />

        <!-- Partículas mágicas subindo da esfera -->
        <circle class="particle-1" cx="285" cy="135" r="2.5" fill="#f87171" />
        <circle class="particle-2" cx="305" cy="140" r="2" fill="#fca5a5" />
        <circle class="particle-3" cx="295" cy="130" r="3" fill="#dc2626" />
      </g>

    </svg>
  </div>

</body>
</html>
